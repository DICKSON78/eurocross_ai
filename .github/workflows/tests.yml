name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: eurocross
          MYSQL_DATABASE: eurocross
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -peurocross"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, gd, intl, mbstring, mysql, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies and build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        env:
          APP_ENV: testing
          APP_KEY: base64:u0V6ZE9itXEx61mPjBLO7bkluruaZVExT3QGh4QvctQ=
          BCRYPT_ROUNDS: 4
          BROADCAST_CONNECTION: null
          CACHE_STORE: array
          DB_CONNECTION: mysql
          DB_DATABASE: eurocross
          DB_HOST: 127.0.0.1
          DB_PASSWORD: eurocross
          DB_PORT: 3306
          DB_USERNAME: root
          MAIL_MAILER: array
          OPENAI_API_KEY: ''
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: php artisan test --compact
